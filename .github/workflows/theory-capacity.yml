name: Theory checks
on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  manuscripts:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/theory_capacity.py
      - name: Check changed manuscripts and select runtime tests
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if test "$EVENT_NAME" = pull_request; then
            base=$(git rev-parse HEAD^1)
          elif test "$BEFORE" = 0000000000000000000000000000000000000000; then
            base=$(git hash-object -w -t tree --stdin </dev/null)
          else
            base=$BEFORE
            if ! git cat-file -e "$base^{commit}"; then
              git fetch --no-tags --filter=blob:none --depth=1 origin "$base"
            fi
          fi
          python3 scripts/theory_capacity.py "$base" HEAD
          if git diff --quiet "$base" HEAD -- src scripts tests Makefile .github/workflows/test.yml .github/workflows/theory-capacity.yml; then
            echo 'runtime=false' >> "$GITHUB_OUTPUT"
          else
            status=$?
            test "$status" = 1 || exit "$status"
            echo 'runtime=true' >> "$GITHUB_OUTPUT"
          fi

  digestion:
    needs: manuscripts
    if: needs.manuscripts.outputs.runtime == 'true'
    uses: ./.github/workflows/test.yml

  theory-required:
    if: always()
    needs: [manuscripts, digestion]
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected checks
        env:
          MANUSCRIPTS: ${{ needs.manuscripts.result }}
          RUNTIME: ${{ needs.manuscripts.outputs.runtime }}
          DIGESTION: ${{ needs.digestion.result }}
        run: |
          test "$MANUSCRIPTS" = success
          case "$RUNTIME:$DIGESTION" in
            true:success|false:skipped) exit 0 ;;
            *) exit 1 ;;
          esac
