name: CodeQL

on:
  pull_request:
    branches: [dev]
    paths-ignore:
      - 'Meta/Digestion/**'
      - '**/*.md'
  push:
    branches: [dev]
    paths-ignore:
      - 'Meta/Digestion/**'
      - '**/*.md'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, csharp, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The atom store is manuscript data. Its paths alone overflow SARIF.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/Meta/Digestion/
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
